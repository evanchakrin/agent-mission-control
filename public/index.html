<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Mission Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/app-icon" type="image/png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <img class="hlogo" src="/favicon.svg" alt="Agent Mission Control logo" width="24" height="24">
  <h1>Agent Mission Control</h1>
  <div class="spicker" id="spicker">
    <button id="spickerBtn">— select session —</button>
    <div id="spickerPanel"><input id="spickerSearch" type="text" placeholder="search sessions…"><div id="spickerList"></div></div>
  </div>
  <div class="tabs">
    <button id="viewFleet" class="on">⌂ Fleet</button>
    <button id="viewTable">Table</button>
    <button id="viewFingerprints">🧬 Fingerprints</button>
    <button id="viewCalendar">📅 Calendar</button>
    <button id="viewRings">🎯 Rings</button>
    <button id="viewRhythm">🕛 Rhythm</button>
    <button id="viewProjects">Projects</button>
    <button id="viewUsage">📈 Usage</button>
    <button id="viewFlows">⇶ Flows</button>
    <button id="viewPlaybooks">📖 Playbooks</button>
    <button id="viewBrain">🧠 Brain</button>
    <button id="viewAudit">🛡 Audit</button>
    <button id="viewConstellation">✦ Galaxy</button>
    <button id="viewMachines">Machines</button>
    <button id="viewBoard">Board</button>
    <button id="viewStory">Story</button>
    <button id="viewLanes">Lanes</button>
    <button id="viewWaterfall">Waterfall</button>
    <button id="viewCost">$ Flow</button>
    <button id="viewTimeline">Timeline</button>
  </div>
  <button id="deepSearchBtn" title="search all transcripts">🔎</button>
  <button id="exportBtn" title="download standalone replay">⇩ Export</button>
  <div id="searchOverlay"><div class="so-box"><input id="soInput" type="text" placeholder="Search every transcript on every machine…  (Enter to search, Esc to close)"><div id="soResults"></div></div></div>
  <div class="bell" id="bell" title="notifications">🔔<span id="bellCount" class="bell-count" style="display:none">0</span></div>
  <div class="live-pill"><span class="dot" id="liveDot"></span><span id="liveLabel">&nbsp;</span></div>
  <div id="notifPanel"><div class="notif-head">Notifications <button id="notifClear">clear</button></div><div id="notifList"></div></div>
</header>
<div id="statbar"></div>
<div id="stickbar" style="display:none"></div>
<div id="failbar" style="display:none"></div>
<main>
  <div id="stage">
    <div id="fleet"></div>
    <div id="tableView" style="display:none"></div>
    <div id="fingerprints" style="display:none"></div>
    <div id="calendar" style="display:none"></div>
    <div id="rings" style="display:none"></div>
    <div id="rhythm" style="display:none"></div>
    <div id="projects" style="display:none"></div>
    <div id="usage" style="display:none"></div>
    <div id="flows" style="display:none"></div>
    <div id="playbooks" style="display:none"></div>
    <div id="brain" style="display:none"></div>
    <div id="audit" style="display:none"></div>
    <div id="machines" style="display:none"></div>
    <div id="constellation" style="display:none"><canvas id="constCanvas"></canvas><div class="const-legend"><span style="color:#fb7185">● Claude</span><span style="color:#60a5fa">● Codex</span><span style="color:#c084fc">● OTLP</span><span style="color:#e5e9f0">★ machine · drag stars · scroll to zoom · click to open</span></div></div>
    <div id="board" style="display:none">
      <svg id="edges"></svg>
      <div id="cards"></div>
    </div>
    <div id="timeline" style="display:none"></div>
    <div id="waterfall" style="display:none"></div>
    <div id="lanes" style="display:none"></div>
    <div id="story" style="display:none"></div>
    <div id="costflow" style="display:none"></div>
    <div id="empty" style="display:none">No agent activity yet in this session.</div>
  </div>
  <div id="feed">
    <div class="feed-head">
      <h3>Event Feed</h3>
      <input id="filterText" type="text" placeholder="filter events…">
      <div class="kind-toggles" id="kindToggles"></div>
    </div>
    <div id="events"></div>
  </div>
</main>
<footer>
  <button id="liveBtn" class="on">LIVE</button>
  <button id="playBtn" title="replay">▶</button>
  <select id="speed"><option value="1">1×</option><option value="4" selected>4×</option><option value="16">16×</option></select>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="scrubLabel">0 / 0</span>
</footer>
<div id="drawer">
  <div class="d-head"><h4 id="d-title"></h4><button class="close" id="d-close">esc</button></div>
  <div class="d-meta" id="d-meta"></div>
  <pre id="d-body"></pre>
</div>
<script src="/app.js"></script>
</body>
</html>
