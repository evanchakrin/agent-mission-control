# The money math broke three ways in one week, each fix verified by hand.
# This makes the verification permanent: every push replays the fixture
# transcripts through the real server and asserts the corrected accounting.
name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]   # the hub runs on Windows in production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
