name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node --check server.js
      - name: Smoke test API
        shell: bash
        run: |
          node server.js --port 4199 &
          SERVER_PID=$!
          sleep 2
          curl -sf http://localhost:4199/api/sessions > /dev/null
          curl -sf http://localhost:4199/ | grep -q "Agent Mission Control"
          kill $SERVER_PID

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Pack
        run: |
          mkdir -p dist
          zip -r "dist/agent-mission-control-${GITHUB_REF_NAME}.zip" server.js public/ package.json README.md LICENSE
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
